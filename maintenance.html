<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Imbali Studio is temporarily offline while we make a few updates. We'll be back shortly.">
    <link rel="icon" href="assets/images/logo/imbali_blu_symbol.svg" type="image/svg+xml">
    <title>Imbali Studio — Site Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --imbali-footer-surface: #151515;
            --imbali-heading-letter-spacing: -0.03em;
            --imbali-btn-radius: 999px;
            --imbali-heading-font: Helvetica, "Helvetica Neue", Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--imbali-footer-surface);
            color: #a8a8a8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .maintenance {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .maintenance__logo {
            display: block;
            width: 100%;
            max-width: 180px;
            height: auto;
            margin-bottom: 2.5rem;
        }

        .maintenance__headline {
            margin: 0 0 1.25rem;
            max-width: 28ch;
            font-family: var(--imbali-heading-font);
            font-size: clamp(1.75rem, 4.5vw, 2.5rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: var(--imbali-heading-letter-spacing);
            color: #f2f2f2;
        }

        .maintenance__subtext {
            margin: 0 0 2rem;
            max-width: 42ch;
            font-size: clamp(0.9375rem, 2.2vw, 1.0625rem);
            font-weight: 400;
            line-height: 1.65;
            color: #a8a8a8;
        }

        .maintenance__contact {
            margin: 0;
            max-width: 42ch;
            font-size: clamp(0.9375rem, 2.2vw, 1rem);
            line-height: 1.65;
            color: #a8a8a8;
        }

        /* #0a4a63 on #151515 ≈ 1.7:1 contrast — too low; white reads clearly on dark surface */
        .maintenance__contact a {
            color: #f2f2f2;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            transition: color 0.2s ease;
        }

        .maintenance__contact a:hover,
        .maintenance__contact a:focus-visible {
            color: #ffffff;
        }

        .maintenance__contact a:focus-visible {
            outline: 2px solid #f2f2f2;
            outline-offset: 3px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <main class="maintenance">
        <img
            class="maintenance__logo"
            src="assets/images/logo/imbali_logo_wht.svg"
            alt="Imbali Studio"
            width="180"
            height="48"
        >
        <h1 class="maintenance__headline">We're refining something beautiful.</h1>
        <p class="maintenance__subtext">Imbali Studio is undergoing a few updates. We'll be back online shortly — thank you for your patience.</p>
        <p class="maintenance__contact">In the meantime, reach out at <a href="mailto:info@imbali.studio">info@imbali.studio</a></p>
    </main>
</body>
</html>
